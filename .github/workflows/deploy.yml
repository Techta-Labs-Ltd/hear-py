name: Deploy Hear (Python) Lambda

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  id-token: write      # required for AWS OIDC
  contents: read

env:
  AWS_REGION: eu-west-1
  ECR_REPO: hear-python
  FUNCTION_NAME: Hear-Python-dev

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          pip install --no-cache-dir "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" || true

      - name: Provide placeholder env (settings load from .env)
        run: cp .env.example .env || true

      - name: Run tests
        run: pytest tests/ -q

  deploy:
    needs: test            # deploy only if tests pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push image
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPO:${{ github.sha }}"
          docker build --platform linux/amd64 -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy to Lambda (create on first run, update after)
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          SOURCE_FUNCTION: Hear   # copy role + env vars from the existing function
        run: |
          if aws lambda get-function --function-name "$FUNCTION_NAME" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "Updating existing $FUNCTION_NAME"
            aws lambda update-function-code \
              --function-name "$FUNCTION_NAME" --image-uri "$IMAGE" --region "$AWS_REGION"
          else
            echo "Creating $FUNCTION_NAME (cloning role + env from $SOURCE_FUNCTION)"
            ROLE=$(aws lambda get-function-configuration --function-name "$SOURCE_FUNCTION" --region "$AWS_REGION" --query Role --output text)
            ENVJSON=$(aws lambda get-function-configuration --function-name "$SOURCE_FUNCTION" --region "$AWS_REGION" --query Environment --output json)
            aws lambda create-function \
              --function-name "$FUNCTION_NAME" \
              --package-type Image --code ImageUri="$IMAGE" \
              --role "$ROLE" --environment "$ENVJSON" \
              --timeout 30 --memory-size 1024 --architectures x86_64 \
              --region "$AWS_REGION"
          fi
          aws lambda wait function-updated --function-name "$FUNCTION_NAME" --region "$AWS_REGION"
