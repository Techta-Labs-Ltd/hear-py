name: Deploy Hear (Python) Lambda

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  id-token: write      # required for AWS OIDC
  contents: read

env:
  AWS_REGION: eu-west-1
  ECR_REPO: hear-python
  STAGE: development
  STACK_NAME: hear-py-development
  ALEXA_SKILL_ID: amzn1.ask.skill.502ef74e-db9f-485f-acdd-13d23c895e59

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio

      - name: Provide placeholder env (settings load from .env)
        run: cp .env.example .env || true

      - name: Run tests
        env:
          HEAR_SEMANTIC_ROUTER_ENABLED: "0"
        run: pytest tests/ -q

      - name: Import + build smoke test (catches import & registration bugs)
        run: python -c "import main; main._build_skill(); print('main imports + skill builds OK')"

  deploy:
    needs: test            # deploy only if tests pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push image
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPO:${{ github.sha }}"
          docker build --platform linux/amd64 -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy CloudFormation stack
        id: cloudformation
        continue-on-error: true
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          get() { aws ssm get-parameter --name "$1" --with-decryption --query 'Parameter.Value' --output text --region "$AWS_REGION"; }
          get_optional() { get "$1" 2>/dev/null || true; }
          HEAR_API_KEY=$(get "/hear/$STAGE/HEAR_API_KEY")
          WEBHOOK_SECRET=$(get "/hear/$STAGE/WEBHOOK_SECRET")
          WEBHOOK_OUTBOUND_SECRET=$(get "/hear/$STAGE/WEBHOOK_OUTBOUND_SECRET")
          SENTRY_DSN=$(get "/hear/$STAGE/SENTRY_DSN")
          ALEXA_PROACTIVE_CLIENT_ID=$(get_optional "/hear/$STAGE/ALEXA_PROACTIVE_CLIENT_ID")
          ALEXA_PROACTIVE_CLIENT_SECRET=$(get_optional "/hear/$STAGE/ALEXA_PROACTIVE_CLIENT_SECRET")
          for v in "$HEAR_API_KEY" "$WEBHOOK_SECRET" "$WEBHOOK_OUTBOUND_SECRET" "$SENTRY_DSN" "$ALEXA_PROACTIVE_CLIENT_ID" "$ALEXA_PROACTIVE_CLIENT_SECRET"; do echo "::add-mask::$v"; done

          aws cloudformation deploy \
            --template-file template.yaml \
            --stack-name "$STACK_NAME" \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
            --region "$AWS_REGION" \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              Stage="$STAGE" \
              ImageUri="$IMAGE" \
              AlexaSkillId="$ALEXA_SKILL_ID" \
              ResolverProvisionedConcurrency="0" \
              ResolverSemanticRouterEnabled="0" \
              HearApiKey="$HEAR_API_KEY" \
              WebhookSecret="$WEBHOOK_SECRET" \
              WebhookOutboundSecret="$WEBHOOK_OUTBOUND_SECRET" \
              AlexaProactiveClientId="$ALEXA_PROACTIVE_CLIENT_ID" \
              AlexaProactiveClientSecret="$ALEXA_PROACTIVE_CLIENT_SECRET" \
              SentryDsn="$SENTRY_DSN"

      - name: Stack outputs
        if: steps.cloudformation.outcome == 'success'
        run: |
          aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" --query "Stacks[0].Outputs" --output table

      - name: CloudFormation failure details
        if: steps.cloudformation.outcome == 'failure'
        run: |
          aws cloudformation describe-stack-events \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "reverse(sort_by(StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='DELETE_FAILED'], &Timestamp))[:20].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
            --output table

      - name: Stop after infrastructure deployment failure
        if: steps.cloudformation.outcome == 'failure'
        run: |
          echo "CloudFormation failed; refusing to deploy application code without its required infrastructure."
          exit 1
