name: Deploy development

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio ruff mypy vulture "boto3-stubs[essential]"
      - name: Create test environment
        run: cp .env.example .env
      - name: Compile Python
        run: python -m compileall -q main.py src config
      - name: Lint Python
        run: python -m ruff check src tests scripts --select E4,E7,E9,F,I
      - name: Dead-code audit
        run: python -m vulture src --min-confidence 80
      - name: Type-check application source
        run: python -m mypy --follow-imports=skip src
      - name: Run tests
        run: python -m pytest -q
      - name: Build skill smoke test
        run: python -c "from src.application import Application; Application.build_skill(); print('main imports + skill builds OK')"

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: development
    concurrency:
      group: hear-development-deployment
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION_DEV || 'eu-west-1' }}
      ECR_REPO: ${{ vars.ECR_REPO_DEV || 'hear-python' }}
      STACK_NAME: ${{ vars.STACK_NAME_DEV }}
      STAGE: development
      SHORT_STAGE: ${{ vars.SHORT_STAGE_DEV }}
      ALEXA_SKILL_ID: ${{ vars.ALEXA_SKILL_ID_DEV }}
      HEAR_API_URL: https://alexa.hear.surf/api/v1
      HEAR_API_PATH_PREFIX: ${{ vars.HEAR_API_PATH_PREFIX_DEV || 'alexa' }}
      WEBHOOK_OUTBOUND_URL: https://alexa.hear.surf/api/v1/webhooks/event
      HEAR_LOGGING_ENABLED: ${{ vars.HEAR_LOGGING_ENABLED_DEV || 'true' }}
      CANONICAL_IDENTITY_ENABLED: ${{ vars.CANONICAL_IDENTITY_ENABLED_DEV || '1' }}
      RESERVED_CONCURRENCY: '0'
      PROVISIONED_CONCURRENCY: ${{ vars.PROVISIONED_CONCURRENCY_DEV || '0' }}
      PROACTIVE_RESERVED_CONCURRENCY: '0'
      SSM_PARAMETER_PREFIX: ${{ vars.SSM_PARAMETER_PREFIX_DEV || '/hear/development' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate development configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN_DEV }}
        run: |
          : "${AWS_DEPLOY_ROLE_ARN:?Set the AWS_DEPLOY_ROLE_ARN_DEV secret}"
          : "${STACK_NAME:?Set the STACK_NAME_DEV variable}"
          : "${SHORT_STAGE:?Set the SHORT_STAGE_DEV variable}"
          : "${ALEXA_SKILL_ID:?Set the ALEXA_SKILL_ID_DEV variable}"
          case "$HEAR_API_URL" in
            *alexa.hear.media*) echo "Development HEAR_API_URL must not target production"; exit 1 ;;
          esac
          case "$WEBHOOK_OUTBOUND_URL" in
            *alexa.hear.media*) echo "Development WEBHOOK_OUTBOUND_URL must not target production"; exit 1 ;;
          esac
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build, tag, and push development image
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPO:development-${{ github.sha }}"
          docker build --platform linux/amd64 --provenance=false -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
      - name: Deploy development stack
        id: cloudformation
        continue-on-error: true
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          get_required() {
            aws ssm get-parameter --name "$SSM_PARAMETER_PREFIX/$1" --with-decryption \
              --query 'Parameter.Value' --output text --region "$AWS_REGION"
          }
          get_optional() {
            aws ssm get-parameter --name "$SSM_PARAMETER_PREFIX/$1" --with-decryption \
              --query 'Parameter.Value' --output text --region "$AWS_REGION" 2>/dev/null || true
          }
          HEAR_API_KEY=$(get_required HEAR_API_KEY)
          ALEXA_PROACTIVE_CLIENT_ID=$(get_required ALEXA_PROACTIVE_CLIENT_ID)
          ALEXA_PROACTIVE_CLIENT_SECRET=$(get_required ALEXA_PROACTIVE_CLIENT_SECRET)
          WEBHOOK_OUTBOUND_SECRET=$(get_optional WEBHOOK_OUTBOUND_SECRET)
          SENTRY_DSN=$(get_optional SENTRY_DSN)
          echo "::add-mask::$HEAR_API_KEY"
          echo "::add-mask::$ALEXA_PROACTIVE_CLIENT_ID"
          echo "::add-mask::$ALEXA_PROACTIVE_CLIENT_SECRET"
          [[ -z "$WEBHOOK_OUTBOUND_SECRET" ]] || echo "::add-mask::$WEBHOOK_OUTBOUND_SECRET"
          [[ -z "$SENTRY_DSN" ]] || echo "::add-mask::$SENTRY_DSN"
          aws cloudformation deploy \
            --template-file template.yaml \
            --stack-name "$STACK_NAME" \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
            --region "$AWS_REGION" \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              Stage="$STAGE" ShortStage="$SHORT_STAGE" ImageUri="$IMAGE" \
              AlexaSkillId="$ALEXA_SKILL_ID" HearApiUrl="$HEAR_API_URL" \
              HearApiPathPrefix="$HEAR_API_PATH_PREFIX" HearApiKey="$HEAR_API_KEY" \
              AlexaProactiveClientId="$ALEXA_PROACTIVE_CLIENT_ID" AlexaProactiveClientSecret="$ALEXA_PROACTIVE_CLIENT_SECRET" \
              WebhookOutboundUrl="$WEBHOOK_OUTBOUND_URL" WebhookOutboundSecret="$WEBHOOK_OUTBOUND_SECRET" \
              SentryDsn="$SENTRY_DSN" HearLoggingEnabled="$HEAR_LOGGING_ENABLED" \
              CanonicalIdentityEnabled="$CANONICAL_IDENTITY_ENABLED" \
              ReservedConcurrency="$RESERVED_CONCURRENCY" ProvisionedConcurrency="$PROVISIONED_CONCURRENCY" \
              ProactiveReservedConcurrency="$PROACTIVE_RESERVED_CONCURRENCY"
      - name: Show development stack outputs
        if: steps.cloudformation.outcome == 'success'
        run: |
          aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" --query "Stacks[0].Outputs" --output table
      - name: Verify development resolver
        if: steps.cloudformation.outcome == 'success'
        run: |
          FUNCTION_ARN=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='SkillFunctionArn'].OutputValue | [0]" \
            --output text)
          aws lambda invoke --function-name "$FUNCTION_ARN" --region "$AWS_REGION" \
            --cli-binary-format raw-in-base64-out --payload '{"diagnostic":"resolver"}' \
            "$RUNNER_TEMP/resolver-health.json"
          jq -e '.ok == true and .canonicalValue == "Herne Bay"' "$RUNNER_TEMP/resolver-health.json"
      - name: Verify deployed Lambda directly
        if: steps.cloudformation.outcome == 'success'
        run: |
          set -euo pipefail
          FUNCTION_ARN=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='SkillFunctionArn'].OutputValue | [0]" \
            --output text)
          FUNCTION_NAME=${FUNCTION_ARN##*:function:}
          TABLE_NAME=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='PersistenceTableName'].OutputValue | [0]" \
            --output text)

          STATE=$(aws lambda get-function-configuration \
            --function-name "$FUNCTION_NAME" --region "$AWS_REGION" \
            --query State --output text)
          UPDATE_STATUS=$(aws lambda get-function-configuration \
            --function-name "$FUNCTION_NAME" --region "$AWS_REGION" \
            --query LastUpdateStatus --output text)
          [[ "$STATE" == "Active" ]]
          [[ "$UPDATE_STATUS" == "Successful" ]]

          LIVE_VERSION=$(aws lambda get-alias \
            --function-name "$FUNCTION_NAME" --name live --region "$AWS_REGION" \
            --query FunctionVersion --output text)
          QUALIFIED_VERSION=$(aws lambda get-function-configuration \
            --function-name "$FUNCTION_NAME" --qualifier live --region "$AWS_REGION" \
            --query Version --output text)
          [[ "$LIVE_VERSION" != '$LATEST' ]]
          [[ "$LIVE_VERSION" == "$QUALIFIED_VERSION" ]]

          LATEST_IMAGE=$(aws lambda get-function \
            --function-name "$FUNCTION_NAME" --region "$AWS_REGION" \
            --query Code.ResolvedImageUri --output text)
          LIVE_IMAGE=$(aws lambda get-function \
            --function-name "$FUNCTION_NAME" --qualifier live --region "$AWS_REGION" \
            --query Code.ResolvedImageUri --output text)
          EXPECTED_DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPO" \
            --image-ids imageTag=development-${{ github.sha }} \
            --region "$AWS_REGION" \
            --query 'imageDetails[0].imageDigest' --output text)

          [[ "$LATEST_IMAGE" == *"@$EXPECTED_DIGEST" ]]
          [[ "$LIVE_IMAGE" == *"@$EXPECTED_DIGEST" ]]

          TEST_USER_LATEST="amzn1.ask.account.LAMBDA_SMOKE_LATEST_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          TEST_USER_LIVE="amzn1.ask.account.LAMBDA_SMOKE_LIVE_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          export TEST_USER_LATEST TEST_USER_LIVE ALEXA_SKILL_ID GITHUB_RUN_ID

          cleanup_lambda_smoke_user() {
            local user_id="$1"
            local values
            local items
            values=$(jq -nc --arg id "$user_id" '{":id":{S:$id}}')
            items=$(aws dynamodb query \
              --table-name "$TABLE_NAME" --region "$AWS_REGION" \
              --key-condition-expression '#id = :id' \
              --expression-attribute-names '{"#id":"id","#scope":"scope"}' \
              --expression-attribute-values "$values" \
              --projection-expression '#id,#scope' \
              --output json 2>/dev/null || true)
            if [[ -n "$items" ]]; then
              echo "$items" | jq -c '.Items[]? | {id:.id,scope:.scope}' | while read -r key; do
                aws dynamodb delete-item \
                  --table-name "$TABLE_NAME" --region "$AWS_REGION" \
                  --key "$key" >/dev/null || true
              done
            fi
          }
          cleanup_lambda_smoke_state() {
            cleanup_lambda_smoke_user "$TEST_USER_LATEST"
            cleanup_lambda_smoke_user "$TEST_USER_LIVE"
          }
          trap cleanup_lambda_smoke_state EXIT

          python - <<'PY_PAYLOAD'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          def payload(user_id: str, suffix: str) -> dict:
              return {
                  "version": "1.0",
                  "session": {
                      "new": True,
                      "sessionId": f"amzn1.echo-api.session.lambda-smoke-{os.environ['GITHUB_RUN_ID']}-{suffix}",
                      "application": {"applicationId": os.environ["ALEXA_SKILL_ID"]},
                      "user": {"userId": user_id},
                      "attributes": {"onboardingComplete": True},
                  },
                  "context": {
                      "System": {
                          "application": {"applicationId": os.environ["ALEXA_SKILL_ID"]},
                          "user": {
                              "userId": user_id,
                              "permissions": {"scopes": {}},
                          },
                          "device": {
                              "deviceId": f"amzn1.ask.device.LAMBDA_SMOKE_{suffix}",
                              "supportedInterfaces": {},
                          },
                          "apiEndpoint": "https://api.amazonalexa.com",
                          "apiAccessToken": "lambda-smoke-token",
                      },
                      "AudioPlayer": {"playerActivity": "IDLE"},
                  },
                  "request": {
                      "type": "IntentRequest",
                      "requestId": f"amzn1.echo-api.request.lambda-smoke-{os.environ['GITHUB_RUN_ID']}-{suffix}",
                      "timestamp": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
                      "locale": "en-GB",
                      "intent": {
                          "name": "IncreaseSpeedIntent",
                          "confirmationStatus": "NONE",
                          "slots": {},
                      },
                  },
              }

          Path("/tmp/lambda-speed-latest.json").write_text(
              json.dumps(payload(os.environ["TEST_USER_LATEST"], "latest"), separators=(",", ":")),
              encoding="utf-8",
          )
          Path("/tmp/lambda-speed-live.json").write_text(
              json.dumps(payload(os.environ["TEST_USER_LIVE"], "live"), separators=(",", ":")),
              encoding="utf-8",
          )
          PY_PAYLOAD

          invoke_and_assert() {
            local label="$1"
            local payload_file="$2"
            local response_file="$3"
            shift 3
            local meta=""
            local speech
            local attempt
            for attempt in 1 2 3; do
              if meta=$(aws lambda invoke \
                --function-name "$FUNCTION_NAME" "$@" --region "$AWS_REGION" \
                --cli-binary-format raw-in-base64-out \
                --log-type Tail \
                --payload "fileb://$payload_file" \
                "$response_file"); then
                if echo "$meta" | jq -e 'has("FunctionError") | not' >/dev/null; then
                  break
                fi
              fi
              if [[ "$attempt" -eq 3 ]]; then
                echo "$label Lambda invocation failed after $attempt attempts" >&2
                echo "$meta" >&2
                exit 1
              fi
              sleep "$attempt"
            done
            echo "$meta" | jq -e 'has("FunctionError") | not'
            echo "$meta" | jq -r '.LogResult // empty' | base64 -d > "$RUNNER_TEMP/lambda-$label.log"

            jq -e '.version == "1.0" and (.response | type == "object")' "$response_file"
            speech=$(jq -r '.response.outputSpeech.ssml // .response.outputSpeech.text // ""' "$response_file")
            echo "$label response=$(jq -c '{version,response}' "$response_file")"
            echo "$label speech=$speech"
            grep -F "Playback speed set to 1.25x." <<<"$speech"
            if grep -Fq "does not have faster or slower versions" <<<"$speech"; then
              echo "$label Lambda returned the old idle-speed error" >&2
              exit 1
            fi
            echo "$label speech=$speech"
          }

          invoke_and_assert \
            "latest" "/tmp/lambda-speed-latest.json" "$RUNNER_TEMP/lambda-latest-response.json"
          invoke_and_assert \
            "live" "/tmp/lambda-speed-live.json" "$RUNNER_TEMP/lambda-live-response.json" \
            --qualifier live

          LIVE_EXECUTED_VERSION=$(aws lambda invoke \
            --function-name "$FUNCTION_NAME" --qualifier live --region "$AWS_REGION" \
            --cli-binary-format raw-in-base64-out \
            --payload '{"diagnostic":"resolver"}' \
            "$RUNNER_TEMP/lambda-live-resolver.json" \
            --query ExecutedVersion --output text)
          [[ "$LIVE_EXECUTED_VERSION" == "$LIVE_VERSION" ]]
          jq -e '.ok == true and .canonicalValue == "Herne Bay"' \
            "$RUNNER_TEMP/lambda-live-resolver.json"

          echo "Lambda direct verification passed"
          echo "function=$FUNCTION_NAME state=$STATE update=$UPDATE_STATUS"
          echo "latest_image=$LATEST_IMAGE"
          echo "live_alias=live live_version=$LIVE_VERSION live_image=$LIVE_IMAGE"
          echo "expected_digest=$EXPECTED_DIGEST"
      - name: Resolve stateful verification resources
        id: verifier_resources
        if: steps.cloudformation.outcome == 'success'
        run: |
          set -euo pipefail
          FUNCTION_ARN=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='SkillFunctionArn'].OutputValue | [0]" \
            --output text)
          TABLE_NAME=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='PersistenceTableName'].OutputValue | [0]" \
            --output text)
          VERIFIER_ROLE_ARN=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='IssueReportVerifierRoleArn'].OutputValue | [0]" \
            --output text)
          [[ -n "$FUNCTION_ARN" && "$FUNCTION_ARN" != "None" ]]
          [[ -n "$TABLE_NAME" && "$TABLE_NAME" != "None" ]]
          [[ -n "$VERIFIER_ROLE_ARN" && "$VERIFIER_ROLE_ARN" != "None" ]]
          echo "function_name=${FUNCTION_ARN##*:function:}" >> "$GITHUB_OUTPUT"
          echo "table_name=$TABLE_NAME" >> "$GITHUB_OUTPUT"
          echo "role_arn=$VERIFIER_ROLE_ARN" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials for stateful Lambda verification
        if: steps.cloudformation.outcome == 'success'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.verifier_resources.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: HearIssueReportVerifier
          unset-current-credentials: true

      - name: Verify reported Lambda session cases
        id: lambda_report
        continue-on-error: true
        if: steps.cloudformation.outcome == 'success'
        run: |
          python scripts/verify_issue_report_lambda.py \
            --function-name "${{ steps.verifier_resources.outputs.function_name }}" \
            --table-name "${{ steps.verifier_resources.outputs.table_name }}" \
            --skill-id "$ALEXA_SKILL_ID" \
            --region "$AWS_REGION"

      - name: Restore development deploy credentials
        if: always() && steps.cloudformation.outcome == 'success'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions
          unset-current-credentials: true
      - name: Verify reported resolver cases
        id: resolver_report
        continue-on-error: true
        if: steps.cloudformation.outcome == 'success'
        run: |
          set -u
          HEAR_API_KEY=$(aws ssm get-parameter \
            --name "$SSM_PARAMETER_PREFIX/HEAR_API_KEY" \
            --with-decryption --region "$AWS_REGION" \
            --query 'Parameter.Value' --output text)
          echo "::add-mask::$HEAR_API_KEY"
          failures=0

          resolve_case() {
            local utterance="$1"
            curl --fail --silent --show-error \
              --retry 3 --retry-all-errors --retry-delay 1 \
              --connect-timeout 5 --max-time 20 \
              https://resolver.hear.media/resolve \
              -H "Content-Type: application/json" \
              -H "X-Api-Key: $HEAR_API_KEY" \
              --data "$(jq -nc --arg q "$utterance" \
                '{utterance:$q,timezone:"Europe/London",country_code:"gb"}')"
          }

          show_result() {
            jq -c '{
              status,
              intent,
              taxonomyRevision,
              entities: [.entities[]? | {entityType,canonicalValue,originalText,confidence,method}],
              slots: {
                residualQuery: .slots.residualQuery,
                publishedFrom: .slots.publishedFrom,
                publishedTo: .slots.publishedTo
              },
              ambiguities
            }'
          }

          THIS_MONTH='{}'
          for attempt in 1 2 3; do
            THIS_MONTH=$(resolve_case "find me this month salmon" || echo '{"transportError":true}')
            if echo "$THIS_MONTH" | jq -e '
              .status == "resolved"
              and .slots.publishedFrom != null
              and .slots.publishedTo != null
              and ((.slots.residualQuery // "" | ascii_downcase | contains("this month")) | not)
            ' >/dev/null; then
              break
            fi
            sleep "$attempt"
          done
          echo "RESULT this_month=$(echo "$THIS_MONTH" | show_result 2>/dev/null || echo "$THIS_MONTH")"
          if echo "$THIS_MONTH" | jq -e '
            .status == "resolved"
            and .slots.publishedFrom != null
            and .slots.publishedTo != null
            and ((.slots.residualQuery // "" | ascii_downcase | contains("this month")) | not)
          ' >/dev/null; then
            echo "PASS resolver: this month salmon -> temporal range"
          else
            echo "FAIL resolver: this month salmon"
            failures=$((failures + 1))
          fi

          TODAY=$(resolve_case "find me content on today's bible study" || echo '{"transportError":true}')
          echo "RESULT today=$(echo "$TODAY" | show_result 2>/dev/null || echo "$TODAY")"
          if echo "$TODAY" | jq -e '
            .status == "resolved"
            and .slots.publishedFrom != null
            and .slots.publishedTo != null
            and ((.slots.residualQuery // "" | ascii_downcase | contains("today")) | not)
          ' >/dev/null; then
            echo "PASS resolver: today's bible study -> temporal range"
          else
            echo "FAIL resolver: today's bible study"
            failures=$((failures + 1))
          fi

          SOUTHAMPTON=$(resolve_case "find me content in southampton" || echo '{"transportError":true}')
          echo "RESULT southampton=$(echo "$SOUTHAMPTON" | show_result 2>/dev/null || echo "$SOUTHAMPTON")"
          if echo "$SOUTHAMPTON" | jq -e '
            any(.entities[]?;
              .entityType == "location"
              and (.canonicalValue | ascii_downcase) == "southampton"
            )
            and (
              [ .entities[]? | select(.entityType == "organization") ] | length == 0
            )
          ' >/dev/null; then
            echo "PASS resolver: Southampton -> location"
          else
            echo "FAIL resolver: Southampton"
            failures=$((failures + 1))
          fi

          SCOTTISH_FARMER=$(resolve_case "play the scottish farmer" || echo '{"transportError":true}')
          echo "RESULT scottish_farmer=$(echo "$SCOTTISH_FARMER" | show_result 2>/dev/null || echo "$SCOTTISH_FARMER")"
          if echo "$SCOTTISH_FARMER" | jq -e '
            .intent == "organization"
            and any(.entities[]?;
              .entityType == "organization"
              and (.canonicalValue | ascii_downcase) == "the scottish farmer"
            )
            and (
              [ .entities[]? | select(.entityType == "tag" or .entityType == "category") ]
              | length == 0
            )
          ' >/dev/null; then
            echo "PASS resolver: Scottish Farmer -> organization only"
          else
            echo "FAIL resolver: Scottish Farmer"
            failures=$((failures + 1))
          fi

          echo "Resolver issue-report failures=$failures"
          test "$failures" -eq 0
      - name: Mark development Alexa model for upload
        id: alexa_model
        if: steps.cloudformation.outcome == 'success'
        run: echo "upload=true" >> "$GITHUB_OUTPUT"
      - name: Upload development Alexa model
        if: steps.alexa_model.outputs.upload == 'true'
        env:
          ALEXA_LWA_CLIENT_ID: ${{ secrets.ALEXA_LWA_CLIENT_ID_DEV }}
          ALEXA_LWA_CLIENT_SECRET: ${{ secrets.ALEXA_LWA_CLIENT_SECRET_DEV }}
          ALEXA_REFRESH_TOKEN: ${{ secrets.ALEXA_REFRESH_TOKEN_DEV }}
        run: |
          : "${ALEXA_LWA_CLIENT_ID:?Set the ALEXA_LWA_CLIENT_ID_DEV secret}"
          : "${ALEXA_LWA_CLIENT_SECRET:?Set the ALEXA_LWA_CLIENT_SECRET_DEV secret}"
          : "${ALEXA_REFRESH_TOKEN:?Set the ALEXA_REFRESH_TOKEN_DEV secret}"
          python scripts/upload_alexa_model.py \
            --skill-id "$ALEXA_SKILL_ID" \
            --invocation-name "test development" \
            --client-id "$ALEXA_LWA_CLIENT_ID" \
            --client-secret "$ALEXA_LWA_CLIENT_SECRET" \
            --refresh-token "$ALEXA_REFRESH_TOKEN"
      - name: Smoke test development Alexa routing and Lambda
        if: steps.cloudformation.outcome == 'success'
        env:
          ALEXA_LWA_CLIENT_ID: ${{ secrets.ALEXA_LWA_CLIENT_ID_DEV }}
          ALEXA_LWA_CLIENT_SECRET: ${{ secrets.ALEXA_LWA_CLIENT_SECRET_DEV }}
          ALEXA_REFRESH_TOKEN: ${{ secrets.ALEXA_REFRESH_TOKEN_DEV }}
        run: |
          python scripts/smoke_test_alexa_development.py \
            --skill-id "$ALEXA_SKILL_ID" \
            --invocation-name "test development" \
            --client-id "$ALEXA_LWA_CLIENT_ID" \
            --client-secret "$ALEXA_LWA_CLIENT_SECRET" \
            --refresh-token "$ALEXA_REFRESH_TOKEN"
      - name: Fail reported issue verification
        if: steps.lambda_report.outcome == 'failure' || steps.resolver_report.outcome == 'failure'
        run: |
          echo "Reported issue verification failed."
          echo "lambda=${{ steps.lambda_report.outcome }} resolver=${{ steps.resolver_report.outcome }}"
          exit 1
      - name: Show CloudFormation failure details
        if: steps.cloudformation.outcome == 'failure'
        run: |
          FAILED_CHANGE_SET=$(aws cloudformation list-change-sets --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "reverse(sort_by(Summaries[?Status=='FAILED'], &CreationTime))[0].ChangeSetName" \
            --output text)
          if [[ -n "$FAILED_CHANGE_SET" && "$FAILED_CHANGE_SET" != "None" ]]; then
            aws cloudformation describe-events --stack-name "$STACK_NAME" \
              --change-set-name "$FAILED_CHANGE_SET" \
              --region "$AWS_REGION" \
              --query "OperationEvents[?EventType=='VALIDATION_ERROR'].[Timestamp,LogicalResourceId,ValidationName,ValidationStatusReason]" \
              --output table
          fi
          aws cloudformation describe-stack-events --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "reverse(sort_by(StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='DELETE_FAILED'], &Timestamp))[:20].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
            --output table
      - name: Fail after deployment failure
        if: steps.cloudformation.outcome == 'failure'
        run: exit 1
