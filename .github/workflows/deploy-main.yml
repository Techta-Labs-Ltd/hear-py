name: Deploy production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio ruff
      - name: Create test environment
        run: cp .env.example .env
      - name: Audit project
        run: python .agents/skills/hear-architecture-refactor/scripts/audit_architecture.py . --strict
      - name: Compile Python
        run: python -m compileall -q main.py src config
      - name: Lint Python
        run: python -m ruff check src tests --select E4,E7,E9,F,I
      - name: Run tests
        run: python -m pytest -q
      - name: Build skill smoke test
        run: python -c "from src.application import Application; Application.build_skill(); print('main imports + skill builds OK')"

  deploy:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency:
      group: hear-production-deployment
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION_PROD || 'eu-west-1' }}
      ECR_REPO: ${{ vars.ECR_REPO_PROD || 'hear-python' }}
      STACK_NAME: ${{ vars.STACK_NAME_PROD || 'hear-py-prod' }}
      STAGE: production
      SHORT_STAGE: ${{ vars.SHORT_STAGE_PROD || 'prod' }}
      ALEXA_SKILL_ID: ${{ vars.ALEXA_SKILL_ID_PROD }}
      HEAR_API_URL: ${{ vars.HEAR_API_URL_PROD || 'https://alexa.hear.media/api/v1' }}
      HEAR_API_PATH_PREFIX: ${{ vars.HEAR_API_PATH_PREFIX_PROD || 'alexa' }}
      WEBHOOK_OUTBOUND_URL: ${{ vars.WEBHOOK_OUTBOUND_URL_PROD || 'https://alexa.hear.media/api/v1/alexa/events' }}
      POWERTOOLS_LOG_LEVEL: ${{ vars.POWERTOOLS_LOG_LEVEL_PROD || 'INFO' }}
      CANONICAL_IDENTITY_ENABLED: ${{ vars.CANONICAL_IDENTITY_ENABLED_PROD || '1' }}
      RESERVED_CONCURRENCY: '0'
      PROVISIONED_CONCURRENCY: ${{ vars.PROVISIONED_CONCURRENCY_PROD || '0' }}
      PROACTIVE_RESERVED_CONCURRENCY: ${{ vars.PROACTIVE_RESERVED_CONCURRENCY_PROD || '0' }}
      HEAR_API_KEY: ${{ secrets.HEAR_API_KEY_PROD }}
      WEBHOOK_OUTBOUND_SECRET: ${{ secrets.WEBHOOK_OUTBOUND_SECRET_PROD }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN_PROD }}
      ALEXA_PROACTIVE_CLIENT_ID: ${{ secrets.ALEXA_PROACTIVE_CLIENT_ID_PROD }}
      ALEXA_PROACTIVE_CLIENT_SECRET: ${{ secrets.ALEXA_PROACTIVE_CLIENT_SECRET_PROD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate production configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN_PROD }}
        run: |
          : "${AWS_DEPLOY_ROLE_ARN:?Set the AWS_DEPLOY_ROLE_ARN_PROD secret}"
          : "${STACK_NAME:?Set the STACK_NAME_PROD variable}"
          : "${SHORT_STAGE:?Set the SHORT_STAGE_PROD variable}"
          : "${ALEXA_SKILL_ID:?Set the ALEXA_SKILL_ID_PROD variable}"
          : "${HEAR_API_KEY:?Set the HEAR_API_KEY_PROD secret}"
          : "${ALEXA_PROACTIVE_CLIENT_ID:?Set the ALEXA_PROACTIVE_CLIENT_ID_PROD secret}"
          : "${ALEXA_PROACTIVE_CLIENT_SECRET:?Set the ALEXA_PROACTIVE_CLIENT_SECRET_PROD secret}"
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Ensure production ECR repository
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPO" --region "$AWS_REGION" >/dev/null 2>&1 || \
            aws ecr create-repository \
              --repository-name "$ECR_REPO" \
              --region "$AWS_REGION" \
              --image-scanning-configuration scanOnPush=true \
              --encryption-configuration encryptionType=AES256 >/dev/null
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build, tag, and push production image
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPO:production-${{ github.sha }}"
          docker build --platform linux/amd64 --provenance=false -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
      - name: Deploy production stack
        id: cloudformation
        continue-on-error: true
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          aws cloudformation deploy \
            --template-file template.yaml \
            --stack-name "$STACK_NAME" \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
            --region "$AWS_REGION" \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              Stage="$STAGE" ShortStage="$SHORT_STAGE" ImageUri="$IMAGE" \
              AlexaSkillId="$ALEXA_SKILL_ID" HearApiUrl="$HEAR_API_URL" \
              HearApiPathPrefix="$HEAR_API_PATH_PREFIX" HearApiKey="$HEAR_API_KEY" \
              AlexaProactiveClientId="$ALEXA_PROACTIVE_CLIENT_ID" AlexaProactiveClientSecret="$ALEXA_PROACTIVE_CLIENT_SECRET" \
              WebhookOutboundUrl="$WEBHOOK_OUTBOUND_URL" WebhookOutboundSecret="$WEBHOOK_OUTBOUND_SECRET" \
              SentryDsn="$SENTRY_DSN" PowerToolsLogLevel="$POWERTOOLS_LOG_LEVEL" \
              CanonicalIdentityEnabled="$CANONICAL_IDENTITY_ENABLED" \
              ReservedConcurrency="$RESERVED_CONCURRENCY" ProvisionedConcurrency="$PROVISIONED_CONCURRENCY" \
              ProactiveReservedConcurrency="$PROACTIVE_RESERVED_CONCURRENCY"
      - name: Show production stack outputs
        if: steps.cloudformation.outcome == 'success'
        run: |
          aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" --query "Stacks[0].Outputs" --output table
      - name: Verify production resolver
        if: steps.cloudformation.outcome == 'success'
        run: |
          FUNCTION_ARN=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='SkillFunctionArn'].OutputValue | [0]" \
            --output text)
          aws lambda invoke --function-name "$FUNCTION_ARN" --region "$AWS_REGION" \
            --cli-binary-format raw-in-base64-out --payload '{"diagnostic":"resolver"}' \
            "$RUNNER_TEMP/resolver-health.json"
          jq -e '.ok == true and .canonicalValue == "Herne Bay"' "$RUNNER_TEMP/resolver-health.json"
      - name: Show CloudFormation failure details
        if: steps.cloudformation.outcome == 'failure'
        run: |
          aws cloudformation describe-stack-events --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "reverse(sort_by(StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='DELETE_FAILED'], &Timestamp))[:20].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
            --output table
      - name: Fail after deployment failure
        if: steps.cloudformation.outcome == 'failure'
        run: exit 1
